# deploy/compose.prod.yml — single-VPS production topology (PRD §19.3).
#
# This is NOT compose.dev.yml (the laptop stack: observability trio, Mailpit,
# Spotlight, mock DK) and NOT compose.test.yml (the disposable integration
# stack, which runs services from mounted source via `go run`/`uv run` and whose
# one-shot `migrate` service DROPS the database). Everything here runs from an
# immutable, digest-pinned image built and Trivy-scanned by
# .github/workflows/release.yml; nothing mounts repository source.
#
# Topology (DEPLOYMENT.md §1):
#
#   internet → nginx (TLS + SPA + /api proxy) → core → postgres
#                                               core → llm
#
# Nginx is the single ingress and the TLS terminator. There is no second proxy
# in front of it: it serves the SPA, proxies /api to core, and holds the
# certificate. Only nginx is internet-facing — postgres, core and llm publish no
# ports at all, so they are unreachable from outside the host even if the edge
# is compromised.
#
# What this file deliberately does NOT do: WAL archiving to the isolated backup
# destination, and the observability stack. Both are required by S34's Verify
# block and neither is present here — see DEPLOYMENT.md §9 for the outstanding
# checklist items. Bringing this stack up satisfies the TLS/health line of that
# gate and nothing beyond it.
#
# Image references are digest-pinned from the `images.env` artifact the release
# workflow uploads. Tags are mutable; digests are not. Every required value fails
# the `docker compose config` parse when unset rather than defaulting to
# something that would quietly work in the wrong way.
#
# Nothing here is meant to be driven by hand. The four *_IMAGE values come from
# `task release:images` (tools/deploy/release_images.sh), and the lifecycle
# commands are wrapped so the env file is never forgotten:
#
#   export ENVFILE=/etc/market-ops/prod.env
#   task release:images -- --tag v0.1.0 --env-file "$ENVFILE"
#   task release:images:check      task prod:config
#   task prod:certs:issue          task prod:migrate:status / task prod:migrate
#   task prod:up                   task prod:ps / task prod:logs
#   task prod:rollback             (restores $ENVFILE.prev-images; images only)
#
# Each wrapper is exactly `docker compose --env-file "$ENVFILE" -f this-file …`
# and fails closed when ENVFILE is unset. Full sequence: DEPLOYMENT.md §6.1, §10.

name: market-ops-prod

services:
  # ─── PostgreSQL 18 — deterministic-core system of record ────────────────
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
    volumes:
      # PostgreSQL 18+ stores PGDATA under a major-version directory
      # (/var/lib/postgresql/18/docker). Mount the PARENT, not the legacy
      # /var/lib/postgresql/data path, so a future pg_upgrade can operate
      # across version directories without crossing a mount boundary.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [internal]
    restart: unless-stopped

  # ─── Application schema migrations — one-shot, forward-only ─────────────
  # `cmd/core` applies River's OWN job-queue schema at boot and nothing else,
  # so the 41 goose migrations run here before core starts. Forward-only by
  # construction: the image entrypoint is goose and the command is `up`
  # (deploy/goose.Dockerfile). Never point this at `task db:reset`.
  migrate:
    image: ${GOOSE_IMAGE:?GOOSE_IMAGE must be set (digest-pinned migration runner)}
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: ${DATABASE_URL:?DATABASE_URL must be set}
      GOOSE_MIGRATION_DIR: /migrations
    command: ["up"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]
    # A migration runner must never be restarted by the supervisor: a partially
    # applied migration re-run on a loop is how a schema gets corrupted.
    restart: "no"

  # ─── One-shot production owner provisioning ────────────────────────────
  # The ONLY supported way to create the first user. `cmd/seede2e` is not it:
  # that is test/CI-only, defaults to the owner@dev.local fixture identity and
  # is not compiled into any published image. This service runs the SAME
  # digest-pinned core image with the `bootstrap-owner` argument — the only way
  # to reach a second command inside a distroless image with no shell.
  #
  # `profiles` keeps it out of `up`, exactly like certbot: it is run explicitly
  # once per environment (DEPLOYMENT.md §10 step 9b), never supervised.
  #
  # BOOTSTRAP_OWNER_PASSWORD is deliberately NOT listed below. `task
  # prod:bootstrap` prompts for it and passes it with `-e` for that one
  # invocation, so the owner credential never comes to rest in $ENVFILE.
  bootstrap:
    image: ${CORE_IMAGE:?CORE_IMAGE must be set (digest-pinned)}
    profiles: ["bootstrap"]
    command: ["bootstrap-owner"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      BOOTSTRAP_OWNER_EMAIL: ${BOOTSTRAP_OWNER_EMAIL:-}
      BOOTSTRAP_ORG_NAME: ${BOOTSTRAP_ORG_NAME:-}
      BOOTSTRAP_ACCOUNT_NATIVE_ID: ${BOOTSTRAP_ACCOUNT_NATIVE_ID:-}
      BOOTSTRAP_ACCOUNT_DISPLAY_NAME: ${BOOTSTRAP_ACCOUNT_DISPLAY_NAME:-}
      # Rotating an existing owner's password must be a conscious act: unset,
      # a re-run reports the existing identifiers and changes nothing.
      BOOTSTRAP_ROTATE_PASSWORD: ${BOOTSTRAP_ROTATE_PASSWORD:-false}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks: [internal]
    restart: "no"

  # ─── Go deterministic core — gateway, money, policy, approval, execution ─
  core:
    image: ${CORE_IMAGE:?CORE_IMAGE must be set (digest-pinned)}
    environment:
      APP_ENV: prod
      HTTP_ADDR: ":8080"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      # base64 of exactly 32 bytes. DK access/refresh tokens are sealed at rest
      # with this key: changing it without a re-encryption procedure makes every
      # stored token unreadable.
      CONNECTOR_ENCRYPTION_KEY: ${CONNECTOR_ENCRYPTION_KEY:?CONNECTOR_ENCRYPTION_KEY must be set}
      DK_API_BASE_URL: ${DK_API_BASE_URL:?DK_API_BASE_URL must be set}
      LLM_SERVICE_URL: http://llm:8100
      LLM_GATEWAY_TOKEN: ${LLM_GATEWAY_TOKEN:?LLM_GATEWAY_TOKEN must be set}
      APP_BASE_URL: ${APP_BASE_URL:?APP_BASE_URL must be set (absolute https:// origin used in digest email links)}
      CHAT_KILL_SWITCH: ${CHAT_KILL_SWITCH:-false}
      CHAT_KILL_SWITCH_ACCOUNTS: ${CHAT_KILL_SWITCH_ACCOUNTS:-}
      SMTP_ADDR: ${SMTP_ADDR:-localhost:1025}
      # Empty ⇒ the daily digest job is not wired at all. That is the intended
      # default: the beta never sends mail without an explicit sender.
      NOTIFY_FROM_ADDR: ${NOTIFY_FROM_ADDR:-}
      NOTIFY_LOCALE: ${NOTIFY_LOCALE:-fa-IR}
      NOTIFY_REGION: ${NOTIFY_REGION:-IR}
      CURRENCY_CONTRACT_VERSION: ${CURRENCY_CONTRACT_VERSION:-v1}
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # No healthcheck: the image is distroless/static — no shell, no wget, no
    # curl — so a container-level probe is impossible without shipping a probe
    # binary purely to be probed. The nginx healthcheck below calls
    # /api/healthz, which proxies straight through to this service, so
    # `up -d --wait` still blocks until core genuinely serves traffic. That is a
    # stronger check than a self-probe: it proves the whole edge→core path.
    networks: [internal]
    restart: unless-stopped

  # ─── Python LLM plane — read + Draft-only, no DB credential ─────────────
  llm:
    image: ${LLM_IMAGE:?LLM_IMAGE must be set (digest-pinned)}
    environment:
      # The SAME credential core presents on every call into this plane.
      LLM_GATEWAY_TOKEN: ${LLM_GATEWAY_TOKEN:?LLM_GATEWAY_TOKEN must be set}
      # `mock` makes no paid calls and is the correct production value until the
      # gated provider benchmark selects an endpoint (PRD §4.1 unit economics).
      # Setting openai_compatible before that gate is a budget decision, not a
      # deployment one.
      LLM_PROVIDER_KIND: ${LLM_PROVIDER_KIND:-mock}
      LLM_PROVIDER_BASE_URL: ${LLM_PROVIDER_BASE_URL:-}
      LLM_PROVIDER_API_KEY: ${LLM_PROVIDER_API_KEY:-}
      LLM_PROVIDER_MODEL: ${LLM_PROVIDER_MODEL:-mock-model}
      LLM_CHAT_DISABLED_GLOBAL: ${LLM_CHAT_DISABLED_GLOBAL:-false}
      # LangSmith ships prompts and completions to an external service. Off
      # unless that transfer has been explicitly approved.
      LLM_LANGSMITH_TRACING: "false"
    # DELIBERATE OMISSION, not an oversight: this service never receives
    # DATABASE_URL, CONNECTOR_ENCRYPTION_KEY, or any DK seller token. The LLM
    # plane holds a read+Draft-only credential and no database access (PRD §8,
    # §12.3). Adding either variable here breaks a never-cut invariant.
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [internal]
    restart: unless-stopped

  # ─── Nginx — TLS termination, SPA bundle, same-origin /api proxy ───────
  # The single ingress and the only service publishing host ports. The SPA is
  # baked into this image at build time with VITE_GATEWAY_BASE_URL=/api, so the
  # browser makes same-origin calls and core needs no CORS headers (it sends
  # none). nginx.prod.conf adds the TLS listener, the HTTP→HTTPS redirect and
  # the ACME challenge path to the baked-in configuration.
  nginx:
    image: ${NGINX_IMAGE:?NGINX_IMAGE must be set (digest-pinned)}
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      # Certificates issued by the certbot service below. Read-only here: the
      # ingress consumes certificates, it never writes them.
      - letsencrypt:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    ports:
      - "80:80"
      - "443:8443"
    depends_on:
      - core
    healthcheck:
      # The unpublished plain listener on 8080: /api/healthz proxies to
      # core:8080/healthz, so this probe covers BOTH the ingress and the gateway
      # behind it, without needing a certificate inside the container.
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:8080/api/healthz"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 15s
    networks: [internal]
    restart: unless-stopped

  # ─── certbot — certificate issuance and renewal ────────────────────────
  # Never started by `up`: it is a one-shot tool, run explicitly (see
  # DEPLOYMENT.md §10). `profiles` keeps it out of the default set so it cannot
  # be brought up by accident.
  #
  # `--cert-name market-ops` is load-bearing, not cosmetic: it fixes the live
  # directory to a domain-independent path so nginx.prod.conf can name the
  # certificate as a literal string. This image's ENTRYPOINT bypasses the base
  # image's envsubst step, so a templated path would never be expanded.
  #
  #   first issuance (before nginx is up, port 80 free):
  #     docker compose ... run --rm --service-ports certbot certonly \
  #       --standalone --cert-name market-ops -d "$DK_DOMAIN" \
  #       --email "$DK_ACME_EMAIL" --agree-tos --no-eff-email
  #   renewal (nginx serving /.well-known over port 80):
  #     docker compose ... run --rm certbot renew --webroot -w /var/www/certbot
  #     docker compose ... exec nginx nginx -s reload
  certbot:
    image: certbot/certbot:v5.0.0
    profiles: ["certs"]
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    ports:
      - "80:80"
    networks: [internal]
    restart: "no"

networks:
  # Inbound isolation comes from publishing NO ports for postgres, core and llm,
  # not from Docker's `internal: true`. That flag also blocks EGRESS, which
  # would cut core off from the DK Seller API (DK_API_BASE_URL) and, once the
  # provider gate opens, the LLM plane from its OpenAI-compatible endpoint.
  # Restricting outbound traffic belongs in the host firewall, where it can
  # allow the DK host specifically instead of severing everything.
  internal:

volumes:
  pgdata:
  # Issued certificates and the ACME account key. Losing this volume means
  # re-issuing on next start, which burns the Let's Encrypt rate limit for the
  # hostname — back it up with the database.
  letsencrypt:
  certbot_www:
