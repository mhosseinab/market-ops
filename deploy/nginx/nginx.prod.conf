# Production Nginx configuration: the same ingress as deploy/nginx/nginx.conf,
# plus TLS termination, an HTTP→HTTPS redirect, and the ACME challenge path.
#
# Nginx is the ONLY proxy in this deployment. It serves the SPA, proxies /api to
# core, and terminates TLS — there is no second ingress in front of it.
#
# Mounted over /etc/nginx/nginx.conf in compose.prod.yml. The baked-in
# nginx.conf stays plain-HTTP for the integration stack, which terminates no TLS.
#
# Certificate paths are deliberately domain-INDEPENDENT: certbot is invoked with
# `--cert-name market-ops`, so the live directory is a fixed string. That
# matters because this image sets ENTRYPOINT ["/usr/sbin/nginx"] and therefore
# never runs the base image's docker-entrypoint.d envsubst step — an
# ${DOMAIN}-interpolated path would arrive at nginx as a literal and fail to
# open.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr notice;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format json escape=json '{"time":"$time_iso8601",'
                                '"remote_addr":"$remote_addr",'
                                '"request":"$request",'
                                '"status":$status,'
                                '"body_bytes_sent":$body_bytes_sent,'
                                '"request_time":$request_time,'
                                '"http_referer":"$http_referer",'
                                '"http_user_agent":"$http_user_agent"}';
    access_log /dev/stdout json;

    sendfile on;
    keepalive_timeout 65;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ── Port 80: ACME challenges, and a redirect for everything else ────────
    server {
        listen 80;
        server_name _;

        # certbot --webroot writes challenge files here; the same volume is
        # mounted into the certbot container. This must stay reachable over
        # plain HTTP or renewal fails.
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── Port 8443: TLS. Published as 443 by compose ─────────────────────────
    server {
        listen 8443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/letsencrypt/live/market-ops/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/market-ops/privkey.pem;

        root /usr/share/nginx/html;
        index index.html;

        # Identical to nginx.conf, plus HSTS — which belongs only on the TLS
        # listener, since only it knows the connection was actually secure.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; img-src 'self' data:; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;

        location = /healthz {
            default_type text/plain;
            return 200 "ok\n";
        }

        location /api/ {
            proxy_pass http://core:8080/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }

    # ── Port 8080: plain HTTP on the container network only ─────────────────
    # Never published to the host. It exists so the container healthcheck can
    # probe /api/healthz — proving the edge→core path — without a certificate,
    # and so an on-host operator can curl the gateway during an incident.
    server {
        listen 8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        location = /healthz {
            default_type text/plain;
            return 200 "ok\n";
        }

        location /api/ {
            proxy_pass http://core:8080/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
